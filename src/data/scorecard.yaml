# Go / no-go scorecard. Scores are 1 (very low risk) to 5 (very high risk).
# pillar score = average of its factors; overall = weighted average of pillars.
# Set sample: false once every rating below reflects the team's researched judgment.
sample: true

scale:
  1: Very low
  2: Low
  3: Moderate
  4: High
  5: Very high

bands:
  - { max: 2.0, label: Go, summary: Risks are manageable with standard diligence. }
  - { max: 3.0, label: Go with mitigations, summary: Proceed with a specific mitigation plan for the highest-rated factors. }
  - { max: 3.75, label: Proceed with caution, summary: Viable for risk-tolerant entrants or phased entry only. }
  - { max: 5.0, label: No-go, summary: Risks outweigh expected returns for most enterprises. }

