# Where every photo and video on the site comes from. `npm run media` downloads anything
# missing and rewrites the matching entries in credits.yaml (attribution is automatic).
#
# file:   images → path under src/assets/images/   videos → path under public/media/ (poster saved next to it as .jpg)
# source: unsplash (id = photo id from the URL)       needs UNSPLASH_ACCESS_KEY in .env
#         pexels-photo / pexels-video (id = number)   needs PEXELS_API_KEY in .env
#         wikimedia (id = "File:…" title)             no key
# alt:    what the image shows (screen readers + default caption). Only describe what is verifiably in it.
#
# Images are resized to at most 2400px wide and saved as JPEG. Videos use the largest rendition
# up to 1280px wide (or `maxWidth`) that is under ~8 MB.

- file: singapore/marina-bay-night.jpg
  source: unsplash
  id: 7ryPpZK1qV8
  alt: Marina Bay, Singapore, at night

